name: Release

# Publishes to PyPI via trusted publishing when a version tag is pushed.
# One-time setup on pypi.org: add this repository as a trusted publisher for
# the "wintersolve" project (workflow: release.yml, environment: release).
# See docs/RELEASE_PROCESS.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Check that the tag matches the package version
        run: |
          python -m pip install -e .
          PACKAGE_VERSION="v$(python -c 'import wintersolve; print(wintersolve.__version__)')"
          if [ "$PACKAGE_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match wintersolve.__version__ ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/wintersolve/
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create release with generated notes
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
