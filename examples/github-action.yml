# Drop this file into .github/workflows/ in any repository to get a Repo Brain
# report on every push, visible in the Actions job summary.
name: Repo Brain

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  repo-brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install WinterSolve
        run: python -m pip install wintersolve

      - name: Generate reports
        run: |
          wintersolve brain . --format markdown --output repo-brain.md
          wintersolve brain . --format json --output repo-brain.json

      - name: Show the report in the job summary
        run: cat repo-brain.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the reports with the run
        uses: actions/upload-artifact@v4
        with:
          name: repo-brain
          path: |
            repo-brain.md
            repo-brain.json
